name: Deploy
run-name: Deploy ${{ github.ref_name }} to ${{ github.event.inputs.environment }}

permissions:
  contents: read  # This is required for actions/checkout
  id-token: write  # This is required for authenticating with aws

on:
  workflow_call:
    inputs:
      environment:
        description: "AWS environment to deploy to."
        type: string
        required: true
        default: dev
      run_e2e_tests:
        description: "Run end-to-end tests?"
        type: boolean
        default: true
        required: true
      image_cpu:
        # Keep in sync with terraform otherwise this value will be reverted on the next terraform apply
        description: "CPU units for the App Runner service"
        type: number
        default: 2
        required: false
      image_memory:
        # Keep in sync with terraform otherwise this value will be reverted on the next terraform apply
        description: "Memory (in GB) for the App Runner service"
        type: number
        default: 4
        required: false
    secrets:
      AWS_ACCOUNT:
        required: true
      CI_AWS_ACCOUNT:
        required: true
      SLACK_BOT_TOKEN:
        required: true
      TEMP_SLACK_CHANNEL_ID:
        required: true
      SERVICE_ACCOUNT_USERNAME:
        required: true
      SERVICE_ACCOUNT_PASSWORD:
        required: true
      FS_BASIC_AUTH_USERNAME:
        required: false
      FS_BASIC_AUTH_PASSWORD:
        required: false

jobs:
  deploy:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    name: Deploy
    outputs:
      express_failed: ${{ steps.start_express.outcome == 'failure' || steps.wait_express.outcome == 'failure' }}

    steps:
      - name: Get current date
        shell: bash
        id: currentdatetime
        run: echo "datetime=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/GithubCopilotDeploy
          role-session-name: "funding-service_deploy_${{ inputs.environment }}_${{ steps.currentdatetime.outputs.datetime }}"
          aws-region: eu-west-2

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set ECR repo variable and construct image URI
        id: ecr_info
        run: |
          # Set ECR repo based on account and environment
          ECR_REPO=${{ secrets.CI_AWS_ACCOUNT }}.dkr.ecr.eu-west-2.amazonaws.com/funding-service-ci-shared-app
          # Construct final image URI using provided image tag
          ECR_IMAGE_LOCATION=$ECR_REPO:${{ github.sha }}

          echo "ecr_image_location=$ECR_IMAGE_LOCATION" >> $GITHUB_OUTPUT

      - name: Update ECS image location
        run: ./scripts/update-ecs-task-image.py "${{ steps.ecr_info.outputs.ecr_image_location }}"

      - name: Check for migrations
        id: changes
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          # Get the current deployed DB version
          if [ "$ENVIRONMENT" != "prod" ]; then
            DEPLOYED_VERSION=$(curl -s -f -u "${{ secrets.FS_BASIC_AUTH_USERNAME }}:${{ secrets.FS_BASIC_AUTH_PASSWORD }}" "${{ vars.BASE_URL }}/healthcheck/db") || exit 1
          else
            DEPLOYED_VERSION=$(curl -s -f "${{ vars.BASE_URL }}/healthcheck/db") || exit 1
          fi

          # Get the local repository version
          LOCAL_VERSION=$(cat app/common/data/migrations/.current-alembic-head)

          if [ -z "$LOCAL_VERSION" ]; then
            echo "::error::Local DB version could not be read or is empty. Please check app/common/data/migrations/.current-alembic-head."
            exit 1
          fi
          echo "::notice::Deployed DB version: $DEPLOYED_VERSION"
          echo "::notice::Local DB version: $LOCAL_VERSION"

          # Compare versions and set output
          if [ "$DEPLOYED_VERSION" != "$LOCAL_VERSION" ]; then
            echo "::notice::Versions differ - migrations needed"
            echo "RUN_MIGRATIONS=true" >> $GITHUB_OUTPUT
          else
            echo "::notice::Versions match - no migrations needed"
            echo "RUN_MIGRATIONS=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Database Migrations
        if: steps.changes.outputs.RUN_MIGRATIONS == 'true'
        uses: ./.github/workflows/run-database-migrations


      - name: Install uv
        if: ${{ inputs.environment != 'prod' }}
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.0"

      - name: Start ECS Express deploy - ${{ github.sha }}
        # Dual-running during the App Runner -> ECS Express migration
        # (FSPT-1318): App Runner below remains the live service; this keeps
        # the parallel ECS Express service on the same image. The rollout is
        # started here and collected after the App Runner deploy, so the two
        # proceed in parallel. Express only exists in dev/test for now - drop
        # these conditions when prod joins express_enabled_workspaces in
        # funding-service-terraform.
        id: start_express
        if: ${{ inputs.environment != 'prod' }}
        # Don't let an Express hiccup block an App Runner deploy while the
        # migration beds in. Remove once dual deploys have been green a while.
        continue-on-error: true
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          ECR_IMAGE_LOCATION: ${{ steps.ecr_info.outputs.ecr_image_location }}
        run: uv run scripts/update-ecs-express-image.py --no-wait --environment "${ENVIRONMENT}" "${ECR_IMAGE_LOCATION}"

      - name: Deploy image to App Runner - ${{ github.sha }}
        id: deploy
        uses: awslabs/amazon-app-runner-deploy@8d446e5e06d34b619d712e6f4d35ded91e3c9e7e  # PR #53
        with:
          service: ${{ inputs.environment }}-funding-service
          image: ${{ steps.ecr_info.outputs.ecr_image_location }}
          access-role-arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/${{ inputs.environment }}-funding-service-app-runner-build-role
          region: eu-west-2
          port: 8080
          cpu: ${{inputs.image_cpu}}
          memory: ${{inputs.image_memory}}
          wait-for-service-stability-seconds: 600

      - name: Wait for ECS Express rollout - ${{ github.sha }}
        # Collects the rollout started before the App Runner deploy: waits for
        # the service to settle and fails if it settled on anything other than
        # the image above (i.e. the canary was rolled back).
        id: wait_express
        if: ${{ inputs.environment != 'prod' && steps.start_express.outcome == 'success' }}
        continue-on-error: true
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          ECR_IMAGE_LOCATION: ${{ steps.ecr_info.outputs.ecr_image_location }}
        run: uv run scripts/update-ecs-express-image.py --wait-only --environment "${ENVIRONMENT}" "${ECR_IMAGE_LOCATION}"

  e2e_tests:
    name: Python E2E tests
    if: ${{ inputs.run_e2e_tests == true }}
    needs: [ deploy ]
    uses: ./.github/workflows/run_e2e_tests.yml
    with:
      environment: ${{ inputs.environment }}
    secrets:
      AWS_ACCOUNT: ${{ secrets.AWS_ACCOUNT }}
      SERVICE_ACCOUNT_USERNAME: ${{ secrets.SERVICE_ACCOUNT_USERNAME }}
      SERVICE_ACCOUNT_PASSWORD: ${{ secrets.SERVICE_ACCOUNT_PASSWORD }}

  notify_slack:
    needs: [ deploy, e2e_tests ]
    if: ${{ always() && (needs.deploy.result == 'failure' || needs.e2e_tests.result == 'failure') && github.ref_name == 'main' }}
    uses: communitiesuk/funding-service-design-workflows/.github/workflows/notify-slack-deployment-failed.yml@d4a4c7d63b1d5c82a8c1fe57edea8ef529a60d04  # PR #313
    with:
      app_name: FS Deploy CI ECR
      env_name: ${{ inputs.environment }}
      github_username: ${{ github.actor }}
      workflow_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      compare_url: ${{ github.event_name == 'push' && github.event.compare || null }}
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_NOTIFICATION_CHANNEL_ID: ${{ secrets.TEMP_SLACK_CHANNEL_ID }}

  notify_slack_express:
    # The Express steps are continue-on-error so they never fail the deploy
    # job or block App Runner, but we still want to hear about them in Slack.
    needs: [ deploy ]
    if: ${{ always() && needs.deploy.outputs.express_failed == 'true' && github.ref_name == 'main' }}
    uses: communitiesuk/funding-service-design-workflows/.github/workflows/notify-slack-deployment-failed.yml@d4a4c7d63b1d5c82a8c1fe57edea8ef529a60d04  # PR #313
    with:
      app_name: FS ECS Express Deploy
      env_name: ${{ inputs.environment }}
      github_username: ${{ github.actor }}
      workflow_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      compare_url: ${{ github.event_name == 'push' && github.event.compare || null }}
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_NOTIFICATION_CHANNEL_ID: ${{ secrets.TEMP_SLACK_CHANNEL_ID }}
