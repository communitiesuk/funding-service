name: Run e2e tests in docker compose

permissions:
  contents: read  # This is required for actions/checkout
  id-token: write  # This is required for authenticating with aws

on:
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_call:
    secrets:
      PULLPREVIEW_GOVUK_NOTIFY_API_KEY:
        required: true
      SLACK_BOT_TOKEN:
        required: true
      TEMP_SLACK_CHANNEL_ID:
        required: true

  workflow_dispatch:
    secrets:
      PULLPREVIEW_GOVUK_NOTIFY_API_KEY:
        required: true
      SLACK_BOT_TOKEN:
        required: true
      TEMP_SLACK_CHANNEL_ID:
        required: true

jobs:

  e2e_tests_docker_compose:
    name: Run E2E tests against docker compose (${{ matrix.name }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: preview-first-task
            pytest_args: tests/e2e/deliver_grant_funding/test_create_preview_collection.py::test_first_task_grouped_questions
          - name: preview-second-task-preview
            pytest_args: tests/e2e/deliver_grant_funding/test_create_preview_collection.py::test_second_task_all_question_types_preview
          - name: preview-second-task-recipient
            pytest_args: tests/e2e/deliver_grant_funding/test_create_preview_collection.py::test_second_task_all_question_types_deliver_test_recipient
          - name: preview-cross-section
            pytest_args: tests/e2e/deliver_grant_funding/test_create_preview_collection.py::test_cross_section_data_reference
          - name: rest-pre-award-validation
            pytest_args: tests/e2e/deliver_grant_funding/test_pre_award_validation.py::test_pre_award_validation
          - name: rest-add-another
            pytest_args: tests/e2e/deliver_grant_funding/test_add_another.py::test_add_another_preview_and_fill
          - name: rest-public-sign-up
            pytest_args: tests/e2e/access_grant_funding/test_public_sign_up.py::test_public_sign_up_new_organisation
          - name: rest
            pytest_args: >-
              --ignore=tests/e2e/deliver_grant_funding/test_create_preview_collection.py
              --ignore=tests/e2e/deliver_grant_funding/test_pre_award_validation.py
              --ignore=tests/e2e/deliver_grant_funding/test_add_another.py
              --ignore=tests/e2e/access_grant_funding/test_public_sign_up.py
              tests/e2e
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Disable man-db triggers
        run: |
          # https://github.com/actions/runner-images/issues/10977
          # Disables man-db triggers, which have been a cause of huge (but variable) delays in github action jobs
          # completing; we're seeing pauses on this step of 120+ seconds in some rare cases.
          echo "set man-db/auto-update false" | sudo debconf-communicate
          sudo dpkg-reconfigure man-db

      - name: Install playwright browsers
        run: uv run --frozen playwright install --with-deps chromium

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2.3.0

      - name: start chrome
        run: uv run --frozen pytest --e2e --tracing=retain-on-failure --browser chromium --screenshot=only-on-failure -k test_start_chrome

      - name: Setup certs
        run: |
          sudo apt-get update && sudo apt-get install -y mkcert libnss3-tools
          make certs

          # Install the mkcert CA to the system trust store so it is picked up by the browser.
          sudo certutil -d sql:$HOME/.local/share/pki/nssdb -A -t "C,," -n "mkcert" -i "certs/rootCA.pem"

          echo "GOVUK_NOTIFY_API_KEY=$PULLPREVIEW_GOVUK_NOTIFY_API_KEY" >> .env
          echo "GOVUK_NOTIFY_DISABLE=False" >> .env
          echo "127.0.0.1       sso.communities.gov.localhost funding.communities.gov.localhost" | sudo tee -a /etc/hosts
        env:
          PULLPREVIEW_GOVUK_NOTIFY_API_KEY: ${{ secrets.PULLPREVIEW_GOVUK_NOTIFY_API_KEY }}

      - name: Build assets
        run: npm ci && npm run build

      - name: start docker compose
        env:
           ASSETS_VITE_LIVE_ENABLED: false
        run: docker compose -f docker-compose.yml up -d --wait

      - name: Smoke tests against docker compose
        run: uv run --frozen pytest tests/smoke --confcutdir=tests/smoke --smoke-env local -v

      - name: run e2e tests
        run: |
          uv run --frozen pytest --e2e -n 4 --tracing=retain-on-failure --browser chromium --screenshot=only-on-failure -vv --durations=999 ${{ matrix.pytest_args }}

      - name: Dump docker compose service logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color --tail=200

      - name: stop docker compose
        if: always() # Ensure this runs even if the previous step fails
        run: docker compose -f docker-compose.yml down

      - name: Save test failure tracing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: playwright-traces-${{ matrix.name }}
          path: test-results/*

  notify_slack:
    needs:
      - e2e_tests_docker_compose
    if: ${{ always() && (needs.e2e_tests_docker_compose.result == 'failure') && github.ref_name == 'main'}}
    uses: communitiesuk/funding-service-design-workflows/.github/workflows/notify-slack-deployment-failed.yml@d4a4c7d63b1d5c82a8c1fe57edea8ef529a60d04  # PR #313
    with:
      app_name: FS Docker Compose E2E Tests
      env_name: N/A
      github_username: ${{ github.actor }}
      workflow_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      compare_url: ${{ github.event_name == 'push' && github.event.compare || null }}
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_NOTIFICATION_CHANNEL_ID: ${{ secrets.TEMP_SLACK_CHANNEL_ID }}
